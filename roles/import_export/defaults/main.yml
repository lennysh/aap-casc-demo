---
# defaults file for import_export
aap_configuration_async_delay: 5
aap_configuration_async_retries: 60
aap_configuration_secure_logging: false
aap_hostname: "{{ vault_aap_hostname | default(lookup('env', 'AAP_HOST')) }}"
aap_validate_certs: "{{ vault_aap_validate_certs | default(lookup('env', 'AAP_VERIFY_SSL')) }}"

# AAP 2.4 import fails on ansible-core 2.19+ (see the preflight check in tasks/main.yml).
# Set to true to skip that check, e.g. if every object defines all the affected fields.
import_export_allow_unsupported_core: false

# Import fails before connecting to AAP when the same object (same type and identity fields,
# see import_export_identity_keys) is defined more than once with different values, e.g. in
# both common/ and <env>/imports/. Set to true (import.sh --allow-duplicates) to import anyway.
import_export_allow_duplicates: false

# Before connecting to AAP, import resolves every loaded object (Jinja variables, filters) and
# fails with a list of everything that can't be resolved, so a missing variable can't stop the
# import halfway through. Set to false (import.sh --skip-preflight) to skip the check.
import_export_preflight: true

# Import only the objects defined in these files or folders (absolute paths; import.sh -f sets
# it). Helper variables and vaults are still read from every file. Empty = no file filter.
import_export_only_files: []

# Fields that identify an object for the duplicate check. Objects missing the first field
# are not checked. Variables not listed use __default__.
import_export_identity_keys:
  __default__: [name, organization]
  aap_organizations: [name]
  controller_organizations: [name]
  aap_user_accounts: [username]
  controller_user_accounts: [username]
  controller_credentials: [name, organization, credential_type]
  controller_credential_types: [name]
  controller_credential_input_sources: [target_credential, input_field_name]
  controller_hosts: [name, inventory]
  controller_groups: [name, inventory]
  controller_inventory_sources: [name, inventory]
  controller_schedules: [name, unified_job_template]
  controller_instances: [hostname]
  controller_instance_groups: [name]
  gateway_authenticator_maps: [name, authenticator]
  hub_collections: [name, namespace]

# Variables never duplicate-checked (role assignments have no name; settings are not lists).
import_export_skip_duplicate_check:
  - controller_roles
  - gateway_role_team_assignments
  - gateway_role_user_assignments
  - controller_settings
  - gateway_settings

# Cross-version variable aliases, applied on import (see action_plugins/casc_import_prepare.py).
# Lets config exported from one AAP version be imported into another without edits:
# when a file under common/ or <env>/imports/ defines a `source` variable, its items are
# appended to `target` (after optional key renames) before dispatch runs.
import_export_var_aliases:
  # AAP 2.4 import (infra.controller_configuration) also accepts 2.5+ names
  controller:
    - {target: controller_organizations, source: aap_organizations}
    - {target: controller_organizations, source: gateway_organizations}
    - {target: controller_teams, source: aap_teams}
    - target: controller_user_accounts
      source: aap_user_accounts
      rename_keys:
        is_platform_auditor: is_system_auditor
    - {target: controller_applications, source: aap_applications}
  # AAP 2.5+ import (infra.aap_configuration) also accepts 2.4 names
  gateway:
    - {target: aap_organizations, source: controller_organizations}
    # older 2.5+ exports wrote organizations to both (duplicates are merged)
    - {target: aap_organizations, source: gateway_organizations}
    - {target: aap_teams, source: controller_teams}
    - target: aap_user_accounts
      source: controller_user_accounts
      rename_keys:
        superuser: is_superuser
        auditor: is_platform_auditor
        is_auditor: is_platform_auditor
        is_system_auditor: is_platform_auditor
    - {target: aap_applications, source: controller_applications}

# After aliasing, entries in these variables that share the identity fields are merged
# (first occurrence wins; later ones only add missing fields). This also collapses the
# duplicate orgs older 2.5+ exports produced (aap_organizations.d + gateway_organizations.d).
import_export_merge_keys:
  controller:
    controller_organizations: [name]
    controller_teams: [name, organization]
    controller_user_accounts: [username]
    controller_applications: [name, organization]
  gateway:
    aap_organizations: [name]
    aap_teams: [name, organization]
    aap_user_accounts: [username]
    aap_applications: [name, organization]
...
