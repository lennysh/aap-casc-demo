---
- name: Set fact to clear token when done
  ansible.builtin.set_fact:
    __clear_token: true
  tags:
    - always

- name: Create a new token using gateway username/password
  ansible.platform.token:
    description: 'Temporary token for aap-casc-demo import/export job'
    scope: "write"
    state: present
    aap_hostname: "{{ aap_hostname }}"
    # gateway_hostname: "{{ aap_hostname }}"
    aap_username: "{{ aap_username }}"
    aap_password: "{{ aap_password }}"
    aap_validate_certs: "{{ aap_validate_certs }}"
  vars:
    aap_username: "{{ vault_aap_username | default(lookup('env', 'AAP_USERNAME')) }}"
    aap_password: "{{ vault_aap_password | default(lookup('env', 'AAP_PASSWORD')) }}"
  register: authtoken_res
  changed_when: false
  tags:
    - always
  check_mode: false

# - name: Debug aap_token
#   ansible.builtin.debug:
#     msg:
#       - "aap_token: {{ aap_token | default('None') }}"
#       - "authtoken_res: {{ authtoken_res | default('None') }}"
#   tags:
#     - always

- name: Set fact to store token dict
  ansible.builtin.set_fact:
    aap_token_dict: "{{ aap_token }}"
  tags:
    - always

- name: Set fact to store token
  ansible.builtin.set_fact:
    aap_token: "{{ aap_token.token }}"
  tags:
    - always
...
