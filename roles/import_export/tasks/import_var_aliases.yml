---
# Cross-version aliases: append items defined under another AAP version's variable
# names (import_export_var_aliases[__auth_mode]) onto the names this version's
# dispatch expects. Files are located by content, so this works for filetree and
# flattened layouts alike and does not depend on filetree_read internals (the
# 2.5+ filetree_read skips files whose top-level key is a 2.4 name).
- name: Find files using other-version variable names for AAP {{ casc_aap_version }}
  vars:
    __aliases: "{{ import_export_var_aliases[__auth_mode] | default([]) }}"
  ansible.builtin.find:
    paths: "{{ ([common_dir] if import_common | default(true) | bool else []) + [env_dir ~ '/imports'] }}"
    patterns:
      - "*.yml"
      - "*.yaml"
    excludes:
      - "ignore_*"
    file_type: file
    recurse: true
    read_whole_file: true
    contains: "(?m)^({{ __aliases | map(attribute='source') | join('|') }}):"
  when: __aliases | length > 0
  register: __import_export_alias_files
  tags:
    - always

- name: Read files using other-version variable names for AAP {{ casc_aap_version }}
  ansible.builtin.include_vars:
    file: "{{ __alias_file.path }}"
    name: __import_export_alias_file_contents
  loop: "{{ __import_export_alias_files.files | default([]) }}"
  loop_control:
    loop_var: __alias_file
    label: "{{ __alias_file.path | relpath(env_dir ~ '/..') }}"
  register: __import_export_alias_contents
  tags:
    - always

- name: Append aliased items to target variables for AAP {{ casc_aap_version }}
  vars:
    __alias_items: >-
      {{
        __import_export_alias_contents.results | default([])
        | map(attribute='ansible_facts.__import_export_alias_file_contents')
        | selectattr(__alias.source, 'defined')
        | map(attribute=__alias.source)
        | select('iterable') | reject('string') | reject('mapping')
        | ansible.builtin.flatten(levels=1)
        | rename_keys(__alias.rename_keys | default({}))
      }}
  ansible.builtin.set_fact:
    "{{ __alias.target }}": "{{ ((lookup('ansible.builtin.vars', __alias.target, default=[]) or []) + __alias_items) | unique }}"
  loop: "{{ import_export_var_aliases[__auth_mode] | default([]) }}"
  loop_control:
    loop_var: __alias
    label: "{{ __alias.source }} -=> {{ __alias.target }}"
  when: __alias_items | length > 0
  no_log: "{{ aap_configuration_secure_logging | default(false) | bool }}"
  tags:
    - always

- name: Merge duplicate objects that share identity fields for AAP {{ casc_aap_version }}
  vars:
    __current: "{{ lookup('ansible.builtin.vars', __merge.key, default=[]) or [] }}"
  ansible.builtin.set_fact:
    "{{ __merge.key }}": "{{ __current | merge_by_key(__merge.value) }}"
  loop: "{{ import_export_merge_keys[__auth_mode] | default({}) | dict2items }}"
  loop_control:
    loop_var: __merge
    label: "{{ __merge.key }} by {{ __merge.value | join('+') }}"
  when:
    - __current is sequence
    - __current is not string
    - __current | length > 1
  no_log: "{{ aap_configuration_secure_logging | default(false) | bool }}"
  tags:
    - always
...
