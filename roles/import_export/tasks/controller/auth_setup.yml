---
- name: Set fact to clear token when done
  ansible.builtin.set_fact:
    __clear_token: true
  tags:
    - always

- name: Create a new token using controller username/password
  ansible.controller.token:
    description: 'Temporary token for aap-casc-demo import/export job'
    scope: "write"
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: "{{ aap_validate_certs }}"
  vars:
    aap_username: "{{ vault_aap_username | default(lookup('env', 'AAP_USERNAME')) }}"
    aap_password: "{{ vault_aap_password | default(lookup('env', 'AAP_PASSWORD')) }}"
  register: authtoken_res
  changed_when: false
  tags:
    - always
  check_mode: false

# Read the token from the registered result rather than the top-level
# `controller_token` fact the module injects (INJECT_FACTS_AS_VARS is deprecated).
- name: Set fact to store token dict
  ansible.builtin.set_fact:
    controller_token_dict: "{{ authtoken_res.ansible_facts.controller_token }}"
  tags:
    - always
...
