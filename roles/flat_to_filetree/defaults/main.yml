---
# defaults file for flat_to_filetree
flat_to_filetree_source_path: ""
flat_to_filetree_output_path: ""

# Flat export files copied as-is into the filetree layout (no list expansion).
# Key: source filename basename from the flat export (e.g. current_settings.yaml).
# Value:
#   folder:    destination directory under flat_to_filetree_output_path
#   filename:  destination filename (optional; defaults to the source basename)
#   var_name:  top-level variable in the file (optional; excluded from expansion)
flat_to_filetree_copy_only_map:
  current_settings.yaml:
    folder: controller_settings.d
    filename: controller_settings.yml
    var_name: controller_settings
  gateway_settings.yaml:
    folder: gateway_settings.d
    filename: gateway_settings.yml
    var_name: gateway_settings

# Every AAP version exports the same standard (AAP 2.5+) layout. Before splitting,
# variables listed here are renamed to `target` (with optional per-item key renames)
# and appended to it. Processed in order.
flat_to_filetree_var_aliases:
  # 2.5+: gateway_organizations only carries name/description; fold into aap_organizations
  gateway_organizations:
    target: aap_organizations
  # 2.4 (infra.controller_configuration) names
  controller_organizations:
    target: aap_organizations
  controller_teams:
    target: aap_teams
  controller_user_accounts:
    target: aap_user_accounts
    rename_keys:
      superuser: is_superuser
      auditor: is_platform_auditor
      is_auditor: is_platform_auditor
      is_system_auditor: is_platform_auditor
  controller_applications:
    target: aap_applications

# After aliasing, entries sharing these identity fields are merged into one (the first
# occurrence wins; later ones only add missing fields). Removes the duplicates produced
# when several exporters (e.g. controller_teams + gateway_teams) write the same objects.
flat_to_filetree_merge_keys:
  aap_organizations: [name]
  aap_teams: [name, organization]
  aap_user_accounts: [username]
  aap_applications: [name, organization]

# Keys are the top-level variable names written by filetree_create (not the template names),
# after flat_to_filetree_var_aliases has been applied.
flat_to_filetree_var_to_folder_map:
  aap_applications: aap_applications.d
  aap_organizations: aap_organizations.d
  aap_teams: aap_teams.d
  aap_user_accounts: aap_user_accounts.d
  controller_credential_input_sources: controller_credential_input_sources.d
  controller_credential_types: controller_credential_types.d
  controller_credentials: controller_credentials.d
  controller_execution_environments: controller_execution_environments.d
  controller_groups: controller_groups.d
  controller_hosts: controller_hosts.d
  controller_instance_groups: controller_instance_groups.d
  controller_instances: controller_instances.d
  controller_inventories: controller_inventories.d
  controller_inventory_sources: controller_inventory_sources.d
  controller_templates: controller_job_templates.d
  controller_labels: controller_labels.d
  controller_notifications: controller_notification_templates.d
  controller_projects: controller_projects.d
  controller_roles: controller_roles.d
  controller_schedules: controller_schedules.d
  controller_workflows: controller_workflow_job_templates.d
  eda_credential_types: eda_credential_types.d
  eda_credentials: eda_credentials.d
  eda_decision_environments: eda_decision_environments.d
  eda_event_streams: eda_event_streams.d
  eda_projects: eda_projects.d
  eda_rulebook_activations: eda_rulebook_activations.d
  gateway_authenticator_maps: gateway_authenticator_maps.d
  gateway_authenticators: gateway_authenticators.d
  gateway_http_ports: gateway_http_ports.d
  gateway_role_definitions: gateway_role_definitions.d
  gateway_role_team_assignments: gateway_role_team_assignments.d
  gateway_role_user_assignments: gateway_role_user_assignments.d
  gateway_routes: gateway_routes.d
  gateway_service_clusters: gateway_service_clusters.d
  gateway_service_keys: gateway_service_keys.d
  gateway_service_nodes: gateway_service_nodes.d
  gateway_services: gateway_services.d
  hub_collection_remotes: hub_collection_remotes.d
  hub_collection_repositories: hub_collection_repositories.d
  hub_collections: hub_collections.d
  hub_ee_images: hub_ee_images.d
  hub_ee_registries: hub_ee_registries.d
  hub_ee_repositories: hub_ee_repositories.d
  hub_namespaces: hub_namespaces.d

# --- This new map defines the FILENAME and SUBFOLDER logic ---
# It checks for keys in the order listed.
flat_to_filetree_filename_logic:

  # --- Type 1: Grouped List ---
  controller_roles:
    - type: list
      key: "team"
      subfolder: "team_roles.d"
    - type: list
      key: "user"
      subfolder: "user_roles.d"

  gateway_role_user_assignments:
    - type: list
      key: "user"
      subfolder: ""

  aap_user_accounts:
    - type: list
      key: "username"
      subfolder: ""

  controller_instances:
    - type: list
      key: "hostname"
      subfolder: ""

  controller_credential_input_sources:
    - type: list
      key: "target_credential"
      subfolder: ""

  # --- Type 4: Default (List grouped by 'name') ---
  __default__:
    - type: list
      key: "name"
      subfolder: ""
...
