---
# tasks file for flat_to_filetree
# All the work (read without templating, alias, merge, split, write, pretty-print) is done
# in one controller-side action plugin: action_plugins/flat_to_filetree_split.py.
- name: 🔀 Split flat variable files into the filetree layout
  flat_to_filetree_split:
    source_path: "{{ flat_to_filetree_source_path }}"
    output_path: "{{ flat_to_filetree_output_path }}"
    copy_only_map: "{{ flat_to_filetree_copy_only_map }}"
    var_aliases: "{{ flat_to_filetree_var_aliases }}"
    merge_keys: "{{ flat_to_filetree_merge_keys }}"
    var_to_folder_map: "{{ flat_to_filetree_var_to_folder_map }}"
    filename_logic: "{{ flat_to_filetree_filename_logic }}"
...
