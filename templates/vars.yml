---
# Environment options. See the README ("Environment vars.yml") for details.

# Export only this AAP organization. Leave unset to export everything the AAP user can see.
# organization_filter: 'Default'

# Export secrets as placeholder variables (e.g. "{{ vault_controller_credentials_x_password }}")
# instead of AAP's "$encrypted$" marker. Define the placeholders in a vault before importing.
secrets_as_variables: true

# Prefix for those placeholder variable names.
secrets_as_variables_prefix: "vault"

# Also import orgs_vars/<workspace>/common/ (configuration shared by every environment of the
# workspace). Set to false to import only this environment's imports/ folder.
import_common: true
...
