---
# Environment vault: how to reach this AAP instance, plus secrets used only by this environment.
# Edit with: ./vault-edit.sh <workspace> <env>

# AAP URL or hostname. On AAP 2.5+ this is the platform gateway.
vault_aap_hostname: "aap.mycompany.com"

# Set to false if AAP uses a self-signed certificate.
vault_aap_validate_certs: true

# --- Authentication (choose ONE) ---

# Option 1: username / password (recommended).
# A temporary token is created for each run and deleted afterwards.
vault_aap_username: "my_admin_user"
vault_aap_password: "my_secret_password" #sensitive

# Option 2: an existing OAuth token. If you use this, comment out the username/password above.
# vault_aap_token: "aBcDeFgHiJkLmNoPqRsTuVwXyZ1234567890" #sensitive

# --- Secrets referenced by your configuration ---
# Define placeholders from exports here, for example:
# vault_controller_credentials_github_password: "ghp_xxxxxxxxxxxx" #sensitive
...
